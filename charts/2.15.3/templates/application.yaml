---
apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: "{{ .Release.Name }}"
  annotations:
    marketplace.cloud.google.com/deploy-info: '{"partner_id": "0014M00001h35jaQAA", "product_id": "suse-rancher-prime", "partner_name": "SUSE LLC"}'
  labels:
    app.kubernetes.io/name: "{{ .Release.Name }}"
spec:
  descriptor:
    type: Rancher
    version: "{{ .Chart.Version }}"
    description: Install SUSE Rancher Prime to manage Kubernetes clusters across providers.
    notes: |-
{{ include (print $.Template.BasePath "/NOTES.txt") . | indent 6 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Release.Name }}"
  componentKinds:
  - group: v1
    kind: Service
  - group: apps/v1
    kind: Deployment
  - group: v1
    kind: ConfigMap
